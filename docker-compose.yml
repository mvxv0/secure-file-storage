services:
  # baza za users i files metapodatke
  mongo:
    image: mongo:7
    container_name: gdrive-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db

  # mailhog za hvatanje otp i verifikacionih mejlova (web ui na http://localhost:8025)
  mailhog:
    image: mailhog/mailhog
    container_name: gdrive-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # smtp port
      - "8025:8025"   # web dashboard

  # minio zakomentarisan dok ne dodjemo do files servisa (kad resimo tag ili pitamo asistenta)
  # minio:
  #   image: quay.io/minio/minio
  #   container_name: gdrive-minio
  #   restart: unless-stopped
  #   command: server /data --console-address ":9001"
  #   ports:
  #     - "9000:9000"
  #     - "9001:9001"
  #   environment:
  #     MINIO_ROOT_USER: ${MINIO_USER}
  #     MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
  #   volumes:
  #     - minio_data:/data

  # neo4j i cassandra dodajemo za sharing i notifications

volumes:
  mongo_data:
  # minio_data:
